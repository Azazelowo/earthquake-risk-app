name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 測試或建置檢查（scripts/check-dist.mjs）沒過就停在這裡，不會部署
      - run: npm test
      - run: npm run build
        env:
          # CARTO 底圖金鑰（使用者決定內建，2026-11-17）。會出現在公開網站的 JS 裡，
          # 靠 CARTO 後台的網域限制（azazelowo.github.io）保護。沒設 secret 時是空字串，CARTO 選項顯示「需要金鑰」。
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
